# REV: 012 - 2026-05-31 18:52 - DEBUG MODE (FULL ASCII SAFE)
name: Mantieni Progetto Attivo - DEBUG

on:
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: STEP 1 - Avvio workflow
        run: |
          echo "=== DEBUG STEP 1 ==="
          echo "Workflow avviato alle: $(date)"
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "===================="

      - name: STEP 2 - Genero LICENSE_KEY
        run: |
          echo "=== DEBUG STEP 2 ==="
          LICENSE_KEY="KEEPALIVE-$(date +%s)"
          echo "LICENSE_KEY generata: $LICENSE_KEY"
          echo "$LICENSE_KEY" > license_key.txt
          echo "===================="

      - name: STEP 3 - Costruisco JSON (SAFE MODE)
        run: |
          echo "=== DEBUG STEP 3 ==="
          LICENSE_KEY=$(cat license_key.txt)

          cat > payload.json <<EOF
{
  "user_email": "ingnichettigb@gmail.com",
  "phone_number": "+390000000000",
  "device_id": "device-keepalive",
  "license_key": "$LICENSE_KEY",
  "app_id": "47f798c0-9430-4d72-bb8d-b91b72944262",
  "app_type": "standard",
  "app_version": "1.0.0",
  "app_code": "APPTEST",
  "is_active": true,
  "auto_renew": false,
  "apk_sent": false
}
EOF

          echo "JSON costruito:"
          cat payload.json
          echo "===================="

      - name: STEP 4 - Valido JSON localmente
        run: |
          echo "=== DEBUG STEP 4 ==="
          jq . payload.json
          echo "JSON valido"
          echo "===================="

      - name: STEP 5 - Invio a Supabase
        run: |
          echo "=== DEBUG STEP 5 ==="
          echo "Invio payload a Supabase..."
          echo "----------------------------"
          curl -v -i -X POST "https://ruopxyprezzxoirfrjrm.supabase.co/rest/v1/licenses" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE }}" \
            -H "Content-Type: application/json" \
            --data-binary "@payload.json"
          echo "----------------------------"
          echo "FINE CURL"
          echo "===================="

