# REV: 013 - 2026-05-31 19:30 - FIX SCHEDULE + CRON
name: Mantieni Progetto Attivo

on:
  schedule:
    - cron: '0 10 */5 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: STEP 1 - Avvio workflow
        run: |
          echo "=== STEP 1 ==="
          echo "Workflow avviato: $(date)"
          echo "==============="

      - name: STEP 2 - Genero LICENSE_KEY
        run: |
          echo "=== STEP 2 ==="
          LICENSE_KEY="KEEPALIVE-$(date +%s)"
          echo "LICENSE_KEY: $LICENSE_KEY"
          echo "LICENSE_KEY=$LICENSE_KEY" >> $GITHUB_ENV
          echo "==============="

      - name: STEP 3 - Invio a Supabase
        run: |
          echo "=== STEP 3 ==="
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            "https://ruopxyprezzxoirfrjrm.supabase.co/rest/v1/licenses" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{
              \"user_email\": \"ingnichettigb@gmail.com\",
              \"phone_number\": \"+390000000000\",
              \"device_id\": \"device-keepalive-${{ github.run_id }}\",
              \"license_key\": \"$LICENSE_KEY\",
              \"app_id\": \"47f798c0-9430-4d72-bb8d-b91b72944262\",
              \"app_type\": \"standard\",
              \"app_version\": \"1.0.0\",
              \"app_code\": \"APPTEST\",
              \"is_active\": true,
              \"auto_renew\": false,
              \"apk_sent\": false
            }")
          echo "HTTP Status: $HTTP_STATUS"
          echo "Risposta: $(cat response.txt)"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "SUCCESSO"
          else
            echo "ERRORE - Status: $HTTP_STATUS"
            exit 1
          fi
          echo "==============="
